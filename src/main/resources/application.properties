spring.config.import=optional:file:.env[.properties]

spring.application.name=tramo-backend

spring.datasource.url=jdbc:postgresql://localhost:5432/tramo
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.default_batch_fetch_size=50

spring.mail.host=smtp.resend.com
spring.mail.port=587
spring.mail.username=resend
spring.mail.password=${RESEND_API_KEY:}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true

app.mail.from=contact@mail.tramo.dev
app.mail.enabled=${MAIL_ENABLED:true}
app.frontend-url=http://localhost:3000

app.google.client-id=${GOOGLE_CLIENT_ID}

app.captcha.secret-key=${RECAPTCHA_SECRET_KEY}
app.captcha.min-score=0.5

app.auth.min-age-years=13
app.auth.rejection-cooldown-hours=24

app.patreon.client-id=${PATREON_CLIENT_ID}
app.patreon.client-secret=${PATREON_CLIENT_SECRET}
app.patreon.redirect-uri=http://localhost:8080/api/auth/patreon/callback
app.patreon.webhook-secret=${PATREON_WEBHOOK_SECRET:}

app.jwt.secret=${JWT_SECRET}
app.jwt.access-token-ttl-ms=900000

# Base64-encoded 256-bit AES key encrypting Patreon OAuth tokens at rest. Generate with:
# openssl rand -base64 32
app.security.token-encryption-key=${TOKEN_ENCRYPTION_KEY}

app.project-id.salt=${PROJECT_ID_SALT}

app.r2.account-id=${R2_ACCOUNT_ID}
app.r2.access-key=${R2_ACCESS_KEY}
app.r2.secret-key=${R2_SECRET}
app.r2.bucket=${R2_BUCKET}
app.r2.public-base-url=${R2_PUBLIC_BASE_URL}

app.limits.free.storage-bytes=524288000
app.limits.supporter.storage-bytes=10737418240
app.limits.max-upload-bytes=26214400
app.limits.max-upload-bytes-per-hour=209715200

app.notifications.sse-timeout-ms=1800000
app.notifications.sse-heartbeat-ms=25000

# Header to trust for the real client IP (used for rate limiting). Leave blank (default) unless
# there's a trusted reverse proxy in front that sets it — e.g. "CF-Connecting-IP" behind Cloudflare.
# A client-supplied X-Forwarded-For must never be trusted directly; it's trivially spoofable.
app.security.client-ip-header=

# Tag system: official/base tags seeded at boot, and the min usage_count for a user-created
# tag to show up in public listings/autocomplete (it's assignable from the moment it's created).
app.tags.visibility-threshold=3
app.tags.cache-ttl-seconds=60
app.tags.rate-limit.capacity=5
app.tags.rate-limit.refill-tokens=5
app.tags.rate-limit.refill-duration-minutes=10
app.tags.seed=javascript,typescript,python,java,react,vue,angular,node-js,html,css,machine-learning,\
  data-science,algorithms,data-structures,web-development,mobile-development,devops,databases,sql,\
  system-design,design,ui-ux,career,interview-prep,open-source,security,cloud,api,testing,git,linux

app.r2.private-bucket=${R2_PRIVATE_BUCKET}
app.uploads.public-editor-images-enabled=${PUBLIC_EDITOR_IMAGES_ENABLED:false}

spring.mvc.log-request-details=false
spring.web.error.include-message=never
spring.web.error.include-binding-errors=never
spring.web.error.include-stacktrace=never
spring.web.error.include-exception=false
spring.web.error.include-path=never
spring.mail.properties.mail.debug=false
spring.mail.properties.mail.debug.auth=false
logging.level.root=INFO
logging.level.org.springframework.web=WARN
logging.level.org.springframework.security=WARN
logging.level.org.springframework.mail=WARN
logging.level.org.springframework.web.servlet.mvc.support.DefaultHandlerExceptionResolver=OFF
logging.level.org.hibernate.orm.connections.pooling=OFF
logging.level.org.flywaydb.core.FlywayExecutor=WARN
logging.level.org.hibernate.SQL=OFF
logging.level.org.hibernate.orm.jdbc.bind=OFF
logging.level.org.hibernate.orm.jdbc.extract=OFF
logging.level.org.hibernate.orm.jdbc.error=OFF
logging.level.org.hibernate.orm.jdbc.warn=OFF
logging.level.org.hibernate.engine.jdbc.spi.SqlExceptionHelper=OFF
logging.level.org.eclipse.angus.mail=WARN
logging.level.jakarta.mail=WARN
logging.level.com.sun.mail=WARN
logging.level.software.amazon.awssdk=WARN
logging.level.software.amazon.awssdk.request=OFF
logging.level.software.amazon.awssdk.requestId=OFF
logging.level.org.apache.http=WARN
logging.level.org.apache.http.wire=OFF
logging.level.org.apache.http.headers=OFF
logging.level.org.apache.hc.client5.http=WARN
logging.level.org.apache.hc.client5.http.wire=OFF
logging.level.org.apache.hc.client5.http.headers=OFF
logging.level.com.google.api.client.http=WARN
logging.level.sun.net.www.protocol.http.HttpURLConnection=WARN
