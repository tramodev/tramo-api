<h1 style="margin:0 0 16px 0;font-size:24px;line-height:1.3;font-weight:500;color:#111111;">{{title}}</h1>
<p style="margin:0 0 16px 0;font-size:16px;line-height:1.6;color:#111111;">Hi {{username}},</p>
<p style="margin:0 0 28px 0;font-size:16px;line-height:1.6;color:#111111;">{{message}}</p>
<table role="presentation" cellpadding="0" cellspacing="0" border="0" style="margin:0 0 28px 0;"><tr>
<td align="center" style="background-color:#1A1A1A;border-radius:999px;"><a href="{{buttonUrl}}" style="display:inline-block;padding:14px 28px;font-family:Roboto,Helvetica,Arial,sans-serif;font-size:16px;font-weight:500;color:#FFFFFF;text-decoration:none;">{{buttonLabel}}</a></td>
</tr></table>
<p style="margin:0 0 8px 0;font-size:13px;line-height:1.5;color:#5C5C5C;">Button not working? Copy and paste this link into your browser:</p>
<p style="margin:0 0 28px 0;font-size:13px;line-height:1.5;word-break:break-all;"><a href="{{buttonUrl}}" style="color:#476EAC;">{{buttonUrl}}</a></p>
<p style="margin:0;font-size:13px;line-height:1.5;color:#5C5C5C;">{{note}}</p>
