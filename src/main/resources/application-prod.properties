# Production overrides. Activate with SPRING_PROFILES_ACTIVE=prod.
#
# application.properties hardcodes a few values to localhost for local dev
# convenience (datasource, frontend URL, Patreon OAuth redirect). Those are fine
# to leave as literal defaults for `./mvnw spring-boot:run`, but must be overridden
# here for any real deployment — the Patreon redirect in particular fails at
# Patreon's side (not ours) if it doesn't exactly match what's registered in the
# Patreon app config, which is easy to miss since nothing in this app validates it.

spring.datasource.url=${DATABASE_URL}

app.frontend-url=${FRONTEND_URL}

app.patreon.redirect-uri=${PATREON_REDIRECT_URI}
